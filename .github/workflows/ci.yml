# NOTE: reference doc
# https://santhosh-adiga-u.medium.com/setting-up-a-complete-ci-cd-pipeline-for-react-using-github-actions-9a07613ceded
name: CI/CD Pipeline


on:
  pull_request:
    branches: [ master ] # or your main branch name

jobs:
  test-checkers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20 # or your preferred Node.js version

      - name: Install dependencies
        run: |
          cd checkers
          npm install

      - name: Run unit tests
        run: |
          cd checkers
          npm run test
  test-ticTacToe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20 # or your preferred Node.js version

      - name: Install dependencies
        run: |
          cd tic_tac_toe
          npm install

      # - name: Run unit tests
      #   run: |
      #     cd tic_tac_toe
      #     npm run test

      - name: Run unit tests
      run: |
        cd tic_tac_toe
        npm test -- --json --outputFile=test-results.json
  cypress-tests-checkers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  # Use the Node.js version compatible with your project

      - name: Install dependencies
        run: |
          cd checkers
          npm install
      
      - name: Start application
        run: |
          cd checkers
          npm start &
        env:
          NODE_ENV: test  # Set environment variables if needed
      
      - name: Run Cypress tests
        run: |
          cd checkers
          npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:3000  # Point Cypress to the local server
  cypress-tests-ticTacToe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  # Use the Node.js version compatible with your project

      - name: Install dependencies
        run: |
          cd tic_tac_toe
          npm install
      
      - name: Start application
        run: |
          cd tic_tac_toe
          npm start &
        env:
          NODE_ENV: test  # Set environment variables if needed
      
      - name: Run Cypress tests
        run: |
          cd tic_tac_toe
          npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:3000  # Point Cypress to the local server